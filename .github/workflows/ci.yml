name: CI

# Control de calidad en la puerta: cada Pull Request debe construir sin
# errores antes de poder fusionarse. Atrapa lockfiles desincronizados,
# imports rotos y errores de build ANTES de que lleguen a main.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build del prototipo completo
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /sp-prototipo
      # El molde viejo de la guía (guia/, datos de ejemplo) se retiró el
      # 23/10/2026. Si alguien lo repone en public/, Next lo copia a out/.
      - name: Verificar que el molde viejo de la guía no volvió
        run: |
          if [ -e out/guia ]; then echo "✗ out/guia quedó publicado (el molde viejo se retiró el 23/10/2026)"; exit 1; fi
          echo "✓ sin el molde viejo de la guía"
      # La copia congelada /v1/ se bajó el 17/10/2026 (sp-interno#181). Next
      # copia public/ entero a out/: si alguien la repone, aparece acá.
      - name: Verificar que la copia congelada /v1/ no volvió
        run: |
          if [ -e out/v1 ]; then echo "✗ out/v1 quedó publicado en el prototipo (se bajó el 17/10/2026, sp-interno#181)"; exit 1; fi
          echo "✓ sin /v1/ en el prototipo"
      # Pruebas sin navegador: segundos, y atajan en la puerta lo que la salud
      # nocturna encontraría a la mañana siguiente (salud-nocturna.yml).
      # cobertura-rutas: una página nueva sin prueba que la abra no entra.
      # esquinas: ningún radio escrito a mano en app/ (sp-interno#60, 23/10/2026).
      # listas-fuente: las listas que se abren a un toque (las ecografías que
      # esperan 3 meses, las 26 cirugías de Essential) contra la grilla y el
      # cuadernillo (23/10/2026).
      # Esas dos miran el código y los datos, no lo construido: corren una vez
      # para las dos ediciones.
      # modo-oscuro: cada página declara «only light» y el texto de fondo
      # (tapiz, muro) va transparente (BITACORA cap. 155); mira out/, así que
      # corre también para la v1, más abajo.
      - name: Pruebas rápidas (buscador, teléfonos de la guía, cobertura de páginas, mapa de la guía, links internos, «seguro» para SP, títulos y sombras, esquinas, listas contra su fuente, modo oscuro)
        run: |
          node scripts/test-buscador.mjs
          node scripts/test-telefonos.mjs
          node qa/cobertura-rutas.mjs
          node qa/mapa-ciudades.mjs
          node qa/links-internos.mjs out /sp-prototipo
          node qa/seguro-propio.mjs out
          node qa/titulos-y-sombras.mjs out
          node qa/esquinas.mjs
          node qa/listas-fuente.mjs
          node qa/modo-oscuro.mjs out
      # El correo del blog (correo-blog.yml) manda a personas reales: sus
      # garantías —nada dos veces, ninguna dirección en los logs, línea de base
      # sin envíos— se prueban acá con un servidor de mentira, sin red.
      - name: Pruebas del correo del blog
        run: python3 scripts/correo-blog/test_correo_blog.py
      # La v1 pública se construye del mismo código (app/edicion.js). Si esta
      # rama esconde un módulo pero deja un link apuntándole, el postbuild
      # (scripts/podar-edicion.mjs) corta acá y el PR no se puede fusionar.
      - name: Build de la edición de lanzamiento (v1)
        run: rm -rf .next && npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /sp-prototipo/lanzamiento
          NEXT_PUBLIC_EDICION: lanzamiento
      - name: Verificar que la v1 publica lo que debe y nada más
        run: |
          for d in guia agendar blog mi-sp historia v1; do
            if [ -e "out/$d" ]; then echo "✗ out/$d quedó publicado en la v1"; exit 1; fi
          done
          for d in guia-medica simulador planes que-cubre; do
            test -f "out/$d/index.html" || { echo "✗ falta out/$d/ en la v1"; exit 1; }
          done
          test -f out/guia-medica/P-0001/index.html || { echo "✗ faltan las fichas de la Guía Médica en la v1"; exit 1; }
          echo "✓ la v1 publica home, simulador, planes, qué cubre y la Guía Médica — y nada de lo que no se lanza"
      - name: Links internos de la v1
        run: node qa/links-internos.mjs out /sp-prototipo/lanzamiento
      - name: «Seguro» para SP en la v1
        run: node qa/seguro-propio.mjs out
      - name: Títulos sin punto y sombras de la v1
        run: node qa/titulos-y-sombras.mjs out
      - name: Modo oscuro de la v1 (solo claro, texto de fondo transparente)
        run: node qa/modo-oscuro.mjs out
