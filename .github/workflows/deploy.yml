name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # ⚠ RED DE SEGURIDAD (6 ago 2026). El 6/08 tres PRs se fusionaron a main
  # (#88, #90, #89) y NINGUNO disparó este workflow: GitHub no encadena
  # workflows cuando el push viene de una acción autenticada con el token de
  # otra acción. Resultado: main quedó 3 commits por delante de producción
  # durante horas, con /que-cubre entero sin publicar, y nadie se enteró
  # porque el sitio seguía respondiendo — solo que con contenido viejo.
  # `push` sigue siendo el camino normal; esto es el paracaídas: si el evento
  # no llegó, a la hora se publica igual. Cuesta un build por hora como mucho.
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # DOS EDICIONES, UN SOLO ARTEFACTO (sep 2026). El mismo código se
      # construye dos veces: el prototipo completo en la raíz y la v1 pública
      # bajo /lanzamiento/. Ver app/edicion.js — la v1 no publica la Guía
      # Médica, Mi SP ni el blog, que se siguen construyendo en el prototipo.
      - name: Build del prototipo completo
        run: npm run build
        env:
          # The repo is served at https://<user>.github.io/sp-prototipo/
          NEXT_PUBLIC_BASE_PATH: /sp-prototipo
      - name: Apartar el prototipo
        run: mv out _site
      # `rm -rf .next` entre builds: la caché de Turbopack guarda el basePath
      # inlineado en los chunks. Sin limpiarla, la v1 puede salir con links al
      # prefijo del build anterior — y eso no falla, solo queda roto.
      - name: Build de la edición de lanzamiento (v1)
        run: rm -rf .next && npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /sp-prototipo/lanzamiento
          NEXT_PUBLIC_EDICION: lanzamiento
      - name: Montar la v1 bajo /lanzamiento/
        run: mv out _site/lanzamiento
      # ⚠ Desde la v4, esta acción deja AFUERA los archivos y carpetas que
      # empiezan con punto (.well-known/, .nojekyll…), sin avisar. El 25/09/2026
      # el sitio no tenía ninguno (verificado en las dos ediciones). Si algún
      # día hace falta publicar uno, sumar `include-hidden-files: true` acá.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
